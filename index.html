<!-- Retired 21 Oct 2026. The previous index is in this repo's history (bb62a67) and in the workshop archive. -->
<style>
  :root { color-scheme: light dark; --bg: #f7f5f0; --card: #ffffff; --ink: #1f2328; --muted: #5b616b; --line: #d9d4c7; --link: #0b5cad; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14161a; --card: #1d2026; --ink: #e8e6e1; --muted: #a3a8b0; --line: #343840; --link: #2f6fb8; } }
  :root[data-theme="dark"] { --bg: #14161a; --card: #1d2026; --ink: #e8e6e1; --muted: #a3a8b0; --line: #343840; --link: #2f6fb8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         padding: 24px 16px; background: var(--bg); color: var(--ink);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 34rem; width: 100%; background: var(--card); border: 1px solid var(--line);
         border-radius: 12px; padding: 28px 24px; }
  .tag { margin: 0 0 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.2; }
  p { margin: 0 0 16px; }
  a.go { display: inline-block; min-height: 44px; padding: 10px 18px; border-radius: 8px; background: var(--link);
         color: #fff; text-decoration: none; font-weight: 600; }
  a.go:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .url { margin-top: 16px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <p class="tag">ferrelldevin.github.io</p>
  <h1>This index page is retired.</h1>
  <p>Retired 21 Oct 2026. The sites it listed are still live at their own addresses:</p>

</main>
</body>
</html>
